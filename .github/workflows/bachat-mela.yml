name: Build Bachat Mela APK
on:
  push:
    branches: [ bachat-mela ]
    paths-ignore: [ 'README.md', 'deals/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/bharosa.keystore
      - run: gradle assembleRelease
        env:
          KS_PATH: ${{ runner.temp }}/bharosa.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/release/app-release.apk BachatMela_v1.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: BachatMela_v1.0.apk }
  shots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots/ }
  release:
    needs: [build, shots]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: shots, path: shots }
      - run: |
          ls -R
          if [ -d shots ]; then (cd shots && zip -r ../screenshots.zip .); else touch screenshots.zip; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bachat-mela-v1.0-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Bachat Mela 1.0 build ${{ github.run_number }}
          body: "Bachat Mela (app.bachatmela.deals) 1.0 — signed release APK + emulator screenshots."
          files: |
            BachatMela_v1.0.apk
            screenshots.zip
          make_latest: false
